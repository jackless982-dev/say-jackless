<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="License Say Jackless campaign layout for climate-minded menswear."
    >
    <title>License Say Jackless</title>
    <link rel="preload" href="images/world-license.png" as="image">
    <link rel="preload" href="images/lookbook-grid.png" as="image">
    <link rel="preload" href="images/runway.png" as="image">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#campaign" aria-label="License Say Jackless home">
        <span>License</span>
        <strong>Say Jackless</strong>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="#campaign">Campaign</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main class="site-main">
      <article id="campaign" class="campaign-board" aria-label="License Say Jackless campaign board">
        <section class="top-mosaic" aria-label="Brand and lookbook">
          <figure class="license-panel">
            <img src="images/world-license.png" alt="License Say Jackless world map artwork">
          </figure>
          <figure class="lookbook-mosaic">
            <img src="images/lookbook-grid.png" alt="Four Say Jackless lookbook portraits in a grid">
          </figure>
        </section>

        <figure class="runway-panel">
          <img src="images/runway.png" alt="Two models walking the Say Jackless runway">
        </figure>

        <section class="climate-panels" aria-label="Sustainability and climate benefits">
          <figure class="benefit-panel">
            <img src="images/sustainability.png" alt="Back view of Say Jackless shirt with earth artwork">
          </figure>
          <figure class="benefit-panel">
            <img src="images/climate.png" alt="Back view of Say Jackless shirt with glowing sun artwork">
          </figure>
        </section>

        <footer class="campaign-slogan">
          <h1>Lizenz für a better clima.</h1>
          <span aria-hidden="true" class="slogan-mark">⌾</span>
        </footer>
      </article>
    </main>

    <footer id="contact" class="site-footer">
      <div>
        <p class="footer-brand">License Say Jackless</p>
        <p>Climate-minded menswear campaign.</p>
      </div>
      <nav class="footer-links" aria-label="Legal pages">
        <a href="imprint/index.html">Imprint</a>
        <a href="privacy-policy/index.html">Privacy Policy</a>
        <a href="terms-and-conditions/index.html">Terms & Conditions</a>
      </nav>
      <a href="mailto:info@jackless.com">info@jackless.com</a>
    </footer>
  </body>
</html>
